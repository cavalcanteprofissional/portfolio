name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes in resume pipeline
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            resume:
              - 'resume/**'

      - name: Check committed CVs
        id: cvs
        run: |
          if compgen -G "public/cv/*.pdf" > /dev/null; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mbart-${{ runner.os }}
          restore-keys: hf-mbart-

      - name: Install Python dependencies
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        run: |
          pip install --upgrade pip
          pip install transformers torch sentencepiece sacremoses jinja2 python-frontmatter pyyaml playwright protobuf tiktoken

      - name: Install Playwright Chromium
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        run: playwright install --with-deps chromium

      - name: Generate resume PDFs
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        run: python resume/build.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_SRC: ${{ vars.VITE_UMAMI_SRC }}
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: |
          # Vite NAO le process.env nem inlinea os ${{ vars.* }} dentro do heredoc;
          # por isso o env: do step fornece as VITE_* e o arquivo eh gerado no shell.
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          VITE_UMAMI_WEBSITE_ID=$VITE_UMAMI_WEBSITE_ID
          VITE_UMAMI_SRC=$VITE_UMAMI_SRC
          VITE_WORKER_URL=$VITE_WORKER_URL
          EOF
          npm run build

      - name: Deploy Cloudflare Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID ausentes — deploy do Worker pulado"
            exit 0
          fi
          npm ci
          npx wrangler deploy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
