[project]
name = "portfolio-cavalcante"
version = "0.1.0"
description = "Resume PDF build pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers (>=5.15.0,<6.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "sentencepiece (>=0.2.2,<0.3.0)",
    "sacremoses (>=0.1.1,<0.2.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-frontmatter (>=1.3.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "playwright (>=1.62.0,<2.0.0)",
    "protobuf (>=7.35.1,<8.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
