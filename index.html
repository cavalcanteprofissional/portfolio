        <style>
          #boot-splash{position:fixed;inset:0;background:hsl(215,45%,8%)}
        </style>
      </div>
    </div>
    <script>
      setTimeout(() => document.getElementById('boot-splash')?.remove(), 5000);
      try {
        window.__bootAudioCtx = new AudioContext();
        window.__bootAudioCtx.resume();
        function wakeBootAudio() {
          if (window.__bootAudioCtx && window.__bootAudioCtx.state === 'suspended')
            window.__bootAudioCtx.resume();
          document.removeEventListener('mousemove', wakeBootAudio);
          document.removeEventListener('touchstart', wakeBootAudio);
          document.removeEventListener('scroll', wakeBootAudio);
        }
        document.addEventListener('mousemove', wakeBootAudio, { once: true });
        document.addEventListener('touchstart', wakeBootAudio, { once: true });
        document.addEventListener('scroll', wakeBootAudio, { once: true, passive: true });
      } catch (e) {}
    </script>
